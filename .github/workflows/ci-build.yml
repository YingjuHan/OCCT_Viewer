name: ci-build

on:
  push:
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ git \
            libopencascade-dev \
            rapidjson-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxi-dev libxmu-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          set -eux
          cmake -S . -B build/ci-linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOCCTV_BUILD_DRAW=OFF \
            -DOCCTV_BUILD_MESH_EXCHANGER=OFF \
            -DOCCTV_BUILD_WEB_VIEWER=OFF \
            -DOCCTV_INSTALL_DEPENDENCIES=OFF \
            -DOCCTV_USE_CONAN=OFF \
            -DOCCTV_USE_DRACO=OFF \
            -DOCCTV_USE_MEDFILE=OFF

      - name: Build
        run: |
          set -eux
          cmake --build build/ci-linux --parallel

  build-wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      OCCT_WASM_URL: ${{ secrets.OCCT_WASM_URL }}
      OCCT_WASM_SHA256: ${{ secrets.OCCT_WASM_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git curl ca-certificates \
            python3 \
            rapidjson-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install TypeScript compiler
        run: |
          set -eux
          npm install -g typescript
          tsc --version

      - name: Setup Emscripten
        uses: emscripten-core/emsdk@v3
        with:
          version: 3.1.58

      - name: Build freetype (WASM)
        run: |
          set -eux
          FREETYPE_VERSION=2.13.2
          curl -L "https://download.savannah.gnu.org/releases/freetype/freetype-${FREETYPE_VERSION}.tar.xz" -o freetype.tar.xz
          tar -xf freetype.tar.xz
          cmake -S "freetype-${FREETYPE_VERSION}" -B 3rdparty/freetype-wasm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/3rdparty/freetype-wasm-install" \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"
          cmake --build 3rdparty/freetype-wasm-build --parallel
          cmake --install 3rdparty/freetype-wasm-build
          test -f "$GITHUB_WORKSPACE/3rdparty/freetype-wasm-install/lib/cmake/freetype/freetype-config.cmake" || true

      - name: Download OpenCASCADE SDK (WASM)
        run: |
          set -eux
          if [ -z "${OCCT_WASM_URL:-}" ]; then
            echo "Missing OCCT_WASM_URL secret; please provide a tarball/zip containing an OCCT install prefix with lib/cmake/opencascade/OpenCASCADEConfig.cmake" >&2
            exit 1
          fi
          mkdir -p 3rdparty/occt-wasm
          curl -L "$OCCT_WASM_URL" -o occt-wasm.tar.gz
          if [ -n "${OCCT_WASM_SHA256:-}" ]; then
            echo "${OCCT_WASM_SHA256}  occt-wasm.tar.gz" | sha256sum -c -
          fi
          tar -xf occt-wasm.tar.gz -C 3rdparty/occt-wasm --strip-components=1
          test -f 3rdparty/occt-wasm/lib/cmake/opencascade/OpenCASCADEConfig.cmake

      - name: Configure (WASM)
        run: |
          set -eux
          cmake -S . -B build/ci-wasm32 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
            -DOpenCASCADE_ROOT_DIR:PATH="$GITHUB_WORKSPACE/3rdparty/occt-wasm" \
            -DFREETYPE_ROOT_DIR:PATH="$GITHUB_WORKSPACE/3rdparty/freetype-wasm-install" \
            -DRapidJSON_ROOT_DIR:PATH="/usr" \
            -DOCCTV_BUILD_DRAW=OFF \
            -DOCCTV_BUILD_MESH_EXCHANGER=OFF \
            -DOCCTV_BUILD_WEB_VIEWER=ON \
            -DOCCTV_INSTALL_DEPENDENCIES=OFF \
            -DOCCTV_USE_CONAN=OFF \
            -DOCCTV_USE_DRACO=OFF \
            -DOCCTV_USE_MEDFILE=OFF \
            -DOCCTV_USE_PTHREADS=OFF \
            -DOCCTV_USE_WASM_EXCEPTION=OFF \
            -DOCCTV_USE_WASM_MEMORY64=OFF \
            -DOCCTV_WASM_CONFIGS:STRING="wasm32" \
            -DOCCTV_WEBVIEWER_INSTALL_PREFIX:PATH="$GITHUB_WORKSPACE/install/ci-wasm"

      - name: Build (WASM)
        run: |
          set -eux
          cmake --build build/ci-wasm32 --parallel

      - name: Install (WASM)
        run: |
          set -eux
          cmake --build build/ci-wasm32 --target install
          test -f "$GITHUB_WORKSPACE/install/ci-wasm/wasm32/Viewer-wasm.wasm"

